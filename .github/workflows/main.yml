name: Build APKs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      aether_repo:
        description: "Aether repository (use your own fork if you changed the core)"
        default: "CluvexStudio/Aether"
      aether_ref:
        description: "Aether tag, branch or full commit hash"
        default: "v2.3.0"
      singbox_ref:
        description: "sing-box tag (the libbox library is built from it)"
        default: "v1.13.21"

permissions:
  contents: write

env:
  # Upstream refs. Change them here if you want other versions.
  AETHER_REPO: ${{ inputs.aether_repo || 'CluvexStudio/Aether' }}
  AETHER_REF: ${{ inputs.aether_ref || 'v2.3.0' }}
  HEV_REF: 2.19.0
  SINGBOX_REF: ${{ inputs.singbox_ref || 'v1.13.21' }}

jobs:
  native:
    name: Native libs (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { abi: arm64-v8a, target: aarch64-linux-android, goarch: arm64, goarm: "" }
    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v4

      - name: Checkout Aether
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AETHER_REPO }}
          ref: ${{ env.AETHER_REF }}
          path: aether-src
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: lukka/get-cmake@latest

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Psiphon and Lyrebird (Go)
        run: |
          out="$GITHUB_WORKSPACE/stage/pt"
          mkdir -p "$out"
          bash aether-src/pt-build.sh linux ${{ matrix.goarch }} "$out" "${{ matrix.goarm }}"
          bash aether-src/psiphon-build.sh linux ${{ matrix.goarch }} "$out" "${{ matrix.goarm }}"
          ls -l "$out"

      - name: Build Aether (Rust, with Tor)
        working-directory: aether-src/aether
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          under=$(echo "${{ matrix.target }}" | tr '-' '_')
          export "BORING_BSSL_RUST_CPPLIB_${under}=static:-bundle=c++"
          cargo ndk -t ${{ matrix.abi }} --platform 26 build --release --features tor
          bin="target/${{ matrix.target }}/release/aether"
          needed=$(readelf -d "$bin" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
          echo "aether NEEDED: $needed"
          if grep -qx 'libc++_shared.so' <<<"$needed"; then
            echo "ERROR: aether still needs libc++_shared.so"; exit 1
          fi

      - name: Build hev-socks5-tunnel (JNI library)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          git clone --recursive --depth 1 --branch "$HEV_REF" https://github.com/heiher/hev-socks5-tunnel.git hev
          cd hev
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH="$PWD" \
            APP_BUILD_SCRIPT="$PWD/Android.mk" \
            NDK_APPLICATION_MK="$PWD/Application.mk" \
            APP_ABI=${{ matrix.abi }} \
            APP_PLATFORM=android-26 \
            NDK_LIBS_OUT="$PWD/libs" \
            NDK_OUT="$PWD/obj" \
            -j"$(nproc)"
          ls -l "libs/${{ matrix.abi }}"

      - name: Stage native files
        run: |
          d="stage/jni/${{ matrix.abi }}"
          mkdir -p "$d"
          cp "aether-src/aether/target/${{ matrix.target }}/release/aether" "$d/libaether.so"
          cp stage/pt/psiphon-tunnel-core "$d/libpsiphon.so"
          cp stage/pt/lyrebird            "$d/liblyrebird.so"
          cp "hev/libs/${{ matrix.abi }}/libhev-socks5-tunnel.so" "$d/libhev-socks5-tunnel.so"
          # Never package host Linux/glibc binaries as Android native libraries.
          for f in "$d"/*.so; do
            file "$f"
            interpreter=$(readelf -l "$f" | sed -n 's/.*Requesting program interpreter: \([^]]*\).*/\1/p')
            if [ -n "$interpreter" ] && [ "$interpreter" != /system/bin/linker64 ]; then
              echo "ERROR: non-Android interpreter in $f: $interpreter"; exit 1
            fi
            readelf -d "$f" | grep -Eq 'libc\.so\.6|ld-linux|libpthread\.so' && { echo "ERROR: glibc dependency in $f"; exit 1; } || true
          done
          ls -l "$d"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.abi }}
          path: stage/jni
          if-no-files-found: error

  libbox:
    name: sing-box library (libbox)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.SINGBOX_REF }}
          path: sing-box
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Same gomobile fork, flags and Java package as sing-box's own Android build.
      # Release distribution is strictly ARM64; build no arm32/x86 variants.
      - name: Build libbox.aar
        working-directory: sing-box
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          export PATH="$PATH:$(go env GOPATH)/bin"
          version="${SINGBOX_REF#v}"
          gomobile bind -v \
            -o libbox.aar \
            -target android/arm64 \
            -androidapi 23 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -trimpath -buildvcs=false \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${version} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -s -w -buildid= -checklinkname=0" \
            -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0" \
            ./experimental/libbox
          ls -l libbox.aar
          test -s libbox.aar || { echo "ERROR: libbox.aar was not produced"; exit 1; }
          unzip -l libbox.aar | grep -E 'classes.jar|jni/.*/libbox.so'

      - uses: actions/upload-artifact@v4
        with:
          name: libbox
          path: sing-box/libbox.aar
          if-no-files-found: error

  apk:
    name: Build APKs
    needs: [native, libbox]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: libbox
          path: libbox-dl

      # Always end up with exactly app/libs/libbox.aar, whatever the artifact layout is,
      # and fail here (with a clear message) instead of deep inside Gradle.
      - name: Place libbox.aar
        run: |
          mkdir -p app/libs
          find libbox-dl -type f -name '*.aar' | head -n1 | xargs -I{} cp {} app/libs/libbox.aar
          ls -l libbox-dl app/libs
          test -s app/libs/libbox.aar || { echo "ERROR: app/libs/libbox.aar is missing"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: app/src/main/jniLibs
          merge-multiple: true

      - name: Check native libs
        run: find app/src/main/jniLibs -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode release keystore (required)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KS" || { echo "ERROR: KEYSTORE_BASE64 is required; refusing unsigned CI distribution"; exit 1; }
          printf '%s' "$KS" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Verify release signing inputs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "ERROR: release signing secrets are incomplete; refusing CI distribution"; exit 1;
          }

      - name: Assemble release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect ARM64 release APK
        run: |
          set -euo pipefail
          mkdir -p out
          cd app/build/outputs/apk/release
          ls -l
          shopt -s nullglob
          apks=( *arm64-v8a*.apk )
          test "${#apks[@]}" -eq 1 || { echo "ERROR: expected exactly one arm64-v8a APK"; exit 1; }
          ! compgen -G '*armeabi-v7a*.apk' >/dev/null
          ! compgen -G '*x86*.apk' >/dev/null
          ! compgen -G '*universal*.apk' >/dev/null
          cp "${apks[0]}" ../../../../../out/PixVPN-arm64-v8a.apk
          ls -l ../../../../../out

      - uses: actions/upload-artifact@v4
        with:
          name: PixVPN-apks
          path: out/*.apk
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
